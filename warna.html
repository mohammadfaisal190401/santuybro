<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contoh Tombol Skema Warna</title>
<script src="https://unpkg.com/chroma-js@2.4.2/chroma.min.js"></script>
<style>
  body {
    font-family: sans-serif;
    text-align: center;
    padding: 40px;
    background: #f5f5f5;
  }
  h1 { color: #ff66a3; margin-bottom: 12px; }
  p { color: #666; font-size: 0.9rem; margin-bottom: 24px; }

  input, select { padding: 8px 12px; margin: 6px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }

  .btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
  .btn { padding: 14px 28px; border-radius: 40px; color: white; font-weight: 600; font-size: 1rem; border: none; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.15); transition: all 0.25s ease; }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); opacity: 0.95; }
</style>
</head>
<body>

<h1>🎨 Tombol Skema Warna</h1>
<p>Pilih warna dasar dan skema, lihat tombolnya berubah!</p>

<input type="text" id="colorInput" value="#0284c7">
<select id="modeSelect">
  <option value="complementary">Complementary</option>
  <option value="analogous">Analogous</option>
  <option value="triadic">Triadic</option>
  <option value="tetradic">Tetradic</option>
</select>

<div class="btns">
  <button class="btn" id="btn1">Tombol 1</button>
  <button class="btn" id="btn2">Tombol 2</button>
</div>

<script>
const input = document.getElementById('colorInput');
const select = document.getElementById('modeSelect');
const btn1 = document.getElementById('btn1');
const btn2 = document.getElementById('btn2');

function generatePalette(hex, mode) {
  const base = chroma(hex).hsl();
  let colors = [hex];

  switch(mode){
    case 'complementary':
      colors.push(chroma.hsl((base[0]+180)%360, base[1], base[2]).hex());
      break;
    case 'analogous':
      colors.push(chroma.hsl((base[0]+30)%360, base[1], base[2]).hex());
      colors.push(chroma.hsl((base[0]-30+360)%360, base[1], base[2]).hex());
      break;
    case 'triadic':
      colors.push(chroma.hsl((base[0]+120)%360, base[1], base[2]).hex());
      colors.push(chroma.hsl((base[0]+240)%360, base[1], base[2]).hex());
      break;
    case 'tetradic':
      colors.push(chroma.hsl((base[0]+90)%360, base[1], base[2]).hex());
      colors.push(chroma.hsl((base[0]+180)%360, base[1], base[2]).hex());
      colors.push(chroma.hsl((base[0]+270)%360, base[1], base[2]).hex());
      break;
  }

  // Tombol 2 warna
  if(colors.length>=2){
    btn1.style.background = `linear-gradient(90deg, ${colors[0]}, ${colors[1]})`;
  }

  // Tombol 3 warna atau fallback
  if(colors.length>=3){
    btn2.style.background = `linear-gradient(90deg, ${colors[0]}, ${colors[1]}, ${colors[2]})`;
  } else {
    btn2.style.background = `linear-gradient(90deg, ${colors[0]}, ${colors[1]}, ${colors[0]})`;
  }
}

// Generate pertama kali
generatePalette(input.value, select.value);

// Update otomatis saat user ganti
input.addEventListener('input', () => generatePalette(input.value, select.value));
select.addEventListener('change', () => generatePalette(input.value, select.value));
</script>

</body>
</html>
