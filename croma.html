<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tombol Unyu Generator 🎀</title>
  <script src="https://unpkg.com/chroma-js@2.4.2/chroma.min.js"></script>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      text-align: center;
      padding: 40px;
      background: #f9fafb;
      color: #333;
    }

    h1 {
      font-size: 1.8rem;
      color: #ff66a3;
      margin-bottom: 8px;
    }

    p {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    input, select {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      margin: 6px;
      text-align: center;
    }

    .palette {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }

    .color-box {
      width: 70px;
      height: 70px;
      border-radius: 10px;
      color: white;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .btns {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .btn {
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
      transition: all 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      opacity: 0.95;
    }

    .btn-2 {
      background: linear-gradient(90deg, #8b5cf6, #3b82f6);
    }

    .btn-3 {
      background: linear-gradient(90deg, #ff8fab, #ffc8dd, #bde0fe);
    }
  </style>
</head>
<body>
  <h1>🎨 Generator Tombol Unyu</h1>
  <p>Masukkan warna dasar (contoh: <code>#0284c7</code>) lalu pilih mode jodoh warna</p>

  <input type="text" id="colorInput" value="#0284c7">
  <select id="modeSelect">
    <option value="complementary">Complementary</option> 
    <option value="analogous">Analogous</option>
    <option value="triadic">Triadic</option>
    <option value="tetradic">Tetradic</option>
  </select>

  <div class="palette" id="palette"></div>

  <div class="btns">
    <button class="btn btn-2">✨ Dua Warna ✨</button>
    <button class="btn btn-3">💖 Tiga Warna 💖</button>
  </div>

  <script>
    const input = document.getElementById('colorInput');
    const select = document.getElementById('modeSelect');
    const paletteDiv = document.getElementById('palette');
    const btn2 = document.querySelector('.btn-2');
    const btn3 = document.querySelector('.btn-3');

    function generatePalette(hex, mode) {
      paletteDiv.innerHTML = '';

      const base = chroma(hex).hsl();
      let colors = [hex];

      switch (mode) {
        case 'complementary':
          colors.push(chroma.hsl((base[0] + 180) % 360, base[1], base[2]).hex());
          break;
        case 'analogous':
          colors.push(chroma.hsl((base[0] + 30) % 360, base[1], base[2]).hex());
          colors.push(chroma.hsl((base[0] - 30 + 360) % 360, base[1], base[2]).hex());
          break;
        case 'triadic':
          colors.push(chroma.hsl((base[0] + 120) % 360, base[1], base[2]).hex());
          colors.push(chroma.hsl((base[0] + 240) % 360, base[1], base[2]).hex());
          break;
        case 'tetradic':
          colors.push(chroma.hsl((base[0] + 90) % 360, base[1], base[2]).hex());
          colors.push(chroma.hsl((base[0] + 180) % 360, base[1], base[2]).hex());
          colors.push(chroma.hsl((base[0] + 270) % 360, base[1], base[2]).hex());
          break;
      }

      // tampilkan kotak warna
      colors.forEach(c => {
        const box = document.createElement('div');
        box.className = 'color-box';
        box.style.background = c;
        box.textContent = c;
        paletteDiv.appendChild(box);
      });

      // update gradient tombol otomatis
      if (colors.length >= 2) {
        btn2.style.background = `linear-gradient(90deg, ${colors[0]}, ${colors[1]})`;
      }
      if (colors.length >= 3) {
        btn3.style.background = `linear-gradient(90deg, ${colors[0]}, ${colors[1]}, ${colors[2]})`;
      } else {
        // fallback kalau cuma dua warna
        btn3.style.background = `linear-gradient(90deg, ${colors[0]}, ${colors[1]}, ${colors[0]})`;
      }
    }

    // generate pertama kali
    generatePalette(input.value, select.value);

    input.addEventListener('input', () => generatePalette(input.value, select.value));
    select.addEventListener('change', () => generatePalette(input.value, select.value));
  </script>
</body>
</html>
