<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Side Samping - Fix Lide 1/3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Verdana, Geneva, Tahoma, sans-serif; background: #f0f0f0; }

    /* Container utama dengan rasio 4:5 */
    #section-side-samping {
      width: 100%;
      max-width: 432px;
      max-height: 540px;
      aspect-ratio: 4 / 5;
      display: flex;
    }

    /* Kotak putih dengan border + shadow */
    #section-side-samping > div {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 1px solid #ccc;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      display: flex;
    }

    /* Flex kiri-kanan */
    .flex-container {
      display: flex;
      width: 100%;
      height: 100%;
      background: rgba(148,163,184,0.15); /* bg-slate-500/15 */
    }

    /* Bagian kiri: fix 1/3 */
    #lide {
      width: 33.33%;
      background: #3b82f6; /* bg-blue-500 */
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 120px 0 12px 0; /* pt-120 pb-12 */
      text-align: center;
    }

    /* Logo lingkaran */
    #lide .logo-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    #lide .logo-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Info merek & harga */
    #logo p {
      margin-top: 8px;
    }
    #logo #merek-side {
      text-transform: uppercase;
      font-size: 15px;
    }
    #logo span, #logo p {
      font-size: 12px;
    }

    #logo span {
      white-space: nowrap;
    }

    #no-bio-sidebar {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      background: #fff;
      color: #000;
      margin-top: 8px;
      white-space: nowrap;
    }

    /* Note di bawah */
    #lide p.note {
      font-size: 8px;
      margin: 0 8px;
    }

    /* Bagian kanan: sisa 2/3 */
    #produk {
      width: 66.66%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
    }

    #produk .img-box {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
    }

    #produk .img-box img {
      width: 90%;
      height: 90%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
  </style>
</head>
<body>
  <a href="index.html">kembali</a>
<div id="section-side-samping">
  <div>
    <div class="flex-container">
      <!-- Bagian kiri -->
      <div id="lide">
        <div class="logo-circle">
          <img src="logo-outfil.jpg" alt="Logo Outfil">
        </div>

        <div id="logo">
          <p id="merek-side">Arrifan</p>
          <p>Rp. <span id="harga-side">120.000</span></p>
          <span class="block mt-3 border w-full mx-auto"></span>
          <p id="no-bio-sidebar">
            link bio No <span>100</span>
          </p>
        </div>

        <p class="note">NOTE: HARGA <br> SAAT UPLOAD</p>
      </div>

      <!-- Bagian kanan -->
      <div id="produk">
        <div class="img-box">
          <img src="celana.png" id="gambar-lide" alt="Produk">
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
