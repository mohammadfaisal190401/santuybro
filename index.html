    <script>
        // ==================== VARIABEL GLOBAL ====================
        let selectedColor = "#4C0094";
        let noLinkMode = 'single';
        let imageTransforms = [];
        let currentEditingImage = null;
        let currentEditingWrap = null;
        let currentEditingIndex = -1;

        // Watermark - default font size 4px, posisi 75%
        let watermarkText = localStorage.getItem('watermarkText') || '';
        let watermarkColor = localStorage.getItem('watermarkColor') || '#ffffff';
        let watermarkFontSize = parseInt(localStorage.getItem('watermarkFontSize') || '4');
        let watermarkTranslateX = parseInt(localStorage.getItem('watermarkTranslateX') || '75');

        // Suffix link
        let linkSuffix = localStorage.getItem('linkSuffix') || 'Z';

        // Padding variables (default: Y=5px, X=0px)
        let paddingY = 5;
        let paddingX = 0;
        let paddingBoth = 0;
        let syncPadding = false;

        // Gap variables (default: Y=3px, X=0px)
        let gapY = 3;
        let gapX = 0;
        let gapBoth = 0;
        let syncGap = false;

        // ==================== FUNGSI UTILITY ====================
        function hexToRgba(hex, opacity) {
            let r, g, b;
            hex = hex.replace('#', '');
            if (hex.length === 3) {
                r = parseInt(hex[0] + hex[0], 16);
                g = parseInt(hex[1] + hex[1], 16);
                b = parseInt(hex[2] + hex[2], 16);
            } else {
                r = parseInt(hex.substring(0, 2), 16);
                g = parseInt(hex.substring(2, 4), 16);
                b = parseInt(hex.substring(4, 6), 16);
            }
            return `rgba(${r}, ${g}, ${b}, ${opacity})`;
        }

        function getBrightness(hexColor) {
            hexColor = hexColor.replace('#', '');
            const r = parseInt(hexColor.substr(0, 2), 16);
            const g = parseInt(hexColor.substr(2, 2), 16);
            const b = parseInt(hexColor.substr(4, 2), 16);
            return (r * 299 + g * 587 + b * 114) / 1000;
        }

        function getTextColorBasedOnBackground(backgroundColor) {
            const brightness = getBrightness(backgroundColor);
            return brightness > 128 ? '#000000' : '#FFFFFF';
        }

        function getColorFromImage(img, x, y, callback) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight);
            const pixelData = ctx.getImageData(x, y, 1, 1).data;
            const r = pixelData[0].toString(16).padStart(2, '0');
            const g = pixelData[1].toString(16).padStart(2, '0');
            const b = pixelData[2].toString(16).padStart(2, '0');
            const hexColor = `#${r}${g}${b}`;
            callback(hexColor);
        }

        // ==================== WATERMARK ====================
        function refreshWatermarks() {
            const watermarks = document.querySelectorAll('.watermark');
            const rgba = hexToRgba(watermarkColor, 0.6);
            const percent = watermarkTranslateX / 100;
            const translateXPercent = (percent * 100) - 50;
            watermarks.forEach(el => {
                el.textContent = watermarkText;
                el.style.color = rgba;
                el.style.fontSize = watermarkFontSize + 'px';
                el.style.transform = `translateY(-50%) translateX(${translateXPercent}%)`;
            });
        }

        // ==================== SUFFIX ====================
        function refreshLinkSuffix() {
            const linkElements = document.querySelectorAll('#capture .link .no-val, #capture .link .no-val-atas, #capture .link .no-val-bawah');
            linkElements.forEach(el => {
                const parent = el.closest('.link');
                if (parent) {
                    const noText = el.textContent;
                    const className = el.className;
                    parent.innerHTML = `Link. <span class="${className}">${noText}</span>${linkSuffix}`;
                    const newSpan = parent.querySelector('.no-val, .no-val-atas, .no-val-bawah');
                    if (newSpan && noLinkMode === 'single') {
                        const singleInput = document.getElementById('single-no-link-input');
                        if (singleInput) {
                            newSpan.textContent = singleInput.value || '1';
                        }
                    }
                }
            });
        }

        // ==================== PADDING ====================
        function applyPaddingToCapture() {
            const capture = document.querySelector('#capture .capture');
            if (!capture) return;
            let topBottom, leftRight;
            if (syncPadding) {
                const bothRange = document.getElementById('paddingBothRange');
                const val = bothRange ? parseInt(bothRange.value) : 0;
                topBottom = val;
                leftRight = val;
                paddingBoth = val;
                const bothLabel = document.getElementById('paddingBothValue');
                if (bothLabel) bothLabel.textContent = val + 'px';
            } else {
                const yRange = document.getElementById('paddingYRange');
                const xRange = document.getElementById('paddingXRange');
                topBottom = yRange ? parseInt(yRange.value) : 5;
                leftRight = xRange ? parseInt(xRange.value) : 0;
                paddingY = topBottom;
                paddingX = leftRight;
                const yLabel = document.getElementById('paddingYValue');
                const xLabel = document.getElementById('paddingXValue');
                if (yLabel) yLabel.textContent = topBottom + 'px';
                if (xLabel) xLabel.textContent = leftRight + 'px';
            }
            capture.style.paddingTop = topBottom + 'px';
            capture.style.paddingBottom = topBottom + 'px';
            capture.style.paddingLeft = leftRight + 'px';
            capture.style.paddingRight = leftRight + 'px';
        }

        // ==================== GAP ====================
        function applyGapToCapture() {
            const capture = document.querySelector('#capture .capture');
            if (!capture) return;
            let gapRow, gapCol;
            if (syncGap) {
                const bothRange = document.getElementById('gapBothRange');
                const val = bothRange ? parseInt(bothRange.value) : 0;
                gapRow = val;
                gapCol = val;
                gapBoth = val;
                const bothLabel = document.getElementById('gapBothValue');
                if (bothLabel) bothLabel.textContent = val + 'px';
            } else {
                const yRange = document.getElementById('gapYRange');
                const xRange = document.getElementById('gapXRange');
                gapRow = yRange ? parseInt(yRange.value) : 3;
                gapCol = xRange ? parseInt(xRange.value) : 0;
                gapY = gapRow;
                gapX = gapCol;
                const yLabel = document.getElementById('gapYValue');
                const xLabel = document.getElementById('gapXValue');
                if (yLabel) yLabel.textContent = gapRow + 'px';
                if (xLabel) xLabel.textContent = gapCol + 'px';
            }
            capture.style.rowGap = gapRow + 'px';
            capture.style.columnGap = gapCol + 'px';
        }

        // ==================== INISIALISASI TRANSFORM ====================
        function initImageTransforms(count) {
            imageTransforms = [];
            for (let i = 0; i < count; i++) {
                imageTransforms.push({
                    scale: 1,
                    rotate: 0,
                    translateX: 0,
                    translateY: 0,
                    width: 100,
                    height: 100,
                    zIndex: 1
                });
            }
        }

        // ==================== PANEL EDIT ====================
        function setupEditPanelListeners() {
            document.querySelectorAll('.range-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const input = document.getElementById(targetId);
                    if (!input) return;
                    const step = parseFloat(input.step) || 1;
                    const isMinus = this.classList.contains('minus');
                    let newVal = parseFloat(input.value) + (isMinus ? -step : step);
                    const min = parseFloat(input.min);
                    const max = parseFloat(input.max);
                    if (newVal < min) newVal = min;
                    if (newVal > max) newVal = max;
                    input.value = newVal;
                    input.dispatchEvent(new Event('input', { bubbles: true }));
                });
            });

            document.getElementById('scaleSlider')?.addEventListener('input', function(e) {
                const val = parseFloat(e.target.value);
                document.getElementById('scaleValue').textContent = val.toFixed(2);
                updateImageTransform('scale', val);
            });
            document.getElementById('rotateSlider')?.addEventListener('input', function(e) {
                const val = parseInt(e.target.value);
                document.getElementById('rotateValue').textContent = val + '°';
                updateImageTransform('rotate', val);
            });
            document.getElementById('translateXSlider')?.addEventListener('input', function(e) {
                const val = parseInt(e.target.value);
                document.getElementById('translateXValue').textContent = val + 'px';
                updateImageTransform('translateX', val);
            });
            document.getElementById('translateYSlider')?.addEventListener('input', function(e) {
                const val = parseInt(e.target.value);
                document.getElementById('translateYValue').textContent = val + 'px';
                updateImageTransform('translateY', val);
            });
            document.getElementById('widthSlider')?.addEventListener('input', function(e) {
                const val = parseInt(e.target.value);
                document.getElementById('widthValue').textContent = val + '%';
                updateImageTransform('width', val);
            });
            document.getElementById('heightSlider')?.addEventListener('input', function(e) {
                const val = parseInt(e.target.value);
                document.getElementById('heightValue').textContent = val + '%';
                updateImageTransform('height', val);
            });
            document.getElementById('zIndexSlider')?.addEventListener('input', function(e) {
                const val = parseInt(e.target.value);
                document.getElementById('zIndexValue').textContent = val;
                updateImageTransform('zIndex', val);
            });
            document.getElementById('resetImageTransform')?.addEventListener('click', function() {
                if (currentEditingImage && currentEditingIndex >= 0) {
                    const defaultTransform = {
                        scale: 1,
                        rotate: 0,
                        translateX: 0,
                        translateY: 0,
                        width: 100,
                        height: 100,
                        zIndex: 1
                    };
                    imageTransforms[currentEditingIndex] = { ...defaultTransform };
                    document.getElementById('scaleSlider').value = 1;
                    document.getElementById('scaleValue').textContent = '1.00';
                    document.getElementById('rotateSlider').value = 0;
                    document.getElementById('rotateValue').textContent = '0°';
                    document.getElementById('translateXSlider').value = 0;
                    document.getElementById('translateXValue').textContent = '0px';
                    document.getElementById('translateYSlider').value = 0;
                    document.getElementById('translateYValue').textContent = '0px';
                    document.getElementById('widthSlider').value = 100;
                    document.getElementById('widthValue').textContent = '100%';
                    document.getElementById('heightSlider').value = 100;
                    document.getElementById('heightValue').textContent = '100%';
                    document.getElementById('zIndexSlider').value = 1;
                    document.getElementById('zIndexValue').textContent = '1';
                    applyTransformToImage(currentEditingImage, currentEditingWrap, defaultTransform);
                }
            });
            document.getElementById('closeEditPanel')?.addEventListener('click', function() {
                document.getElementById('imageEditPanel').style.display = 'none';
                currentEditingImage = null;
                currentEditingWrap = null;
                currentEditingIndex = -1;
            });
        }

        function updateImageTransform(prop, value) {
            if (currentEditingImage && currentEditingIndex >= 0) {
                imageTransforms[currentEditingIndex][prop] = value;
                const transform = imageTransforms[currentEditingIndex];
                applyTransformToImage(currentEditingImage, currentEditingWrap, transform);
            }
        }

        function applyTransformToImage(img, wrap, transform) {
            const transformStr =
                `scale(${transform.scale}) rotate(${transform.rotate}deg) translate(${transform.translateX}px, ${transform.translateY}px)`;
            img.style.transform = transformStr;
            img.style.width = transform.width + '%';
            img.style.height = transform.height + '%';
            img.style.objectFit = 'fill';
            if (wrap) {
                wrap.style.zIndex = transform.zIndex;
            }
        }

        function openEditPanel(index, imgElement, wrapElement) {
            currentEditingImage = imgElement;
            currentEditingWrap = wrapElement;
            currentEditingIndex = index;
            const panel = document.getElementById('imageEditPanel');
            const indexSpan = document.getElementById('selectedImageIndex');
            indexSpan.textContent = `#${index + 1}`;
            const transform = imageTransforms[index] || {
                scale: 1,
                rotate: 0,
                translateX: 0,
                translateY: 0,
                width: 100,
                height: 100,
                zIndex: 1
            };
            document.getElementById('scaleSlider').value = transform.scale;
            document.getElementById('scaleValue').textContent = transform.scale.toFixed(2);
            document.getElementById('rotateSlider').value = transform.rotate;
            document.getElementById('rotateValue').textContent = transform.rotate + '°';
            document.getElementById('translateXSlider').value = transform.translateX;
            document.getElementById('translateXValue').textContent = transform.translateX + 'px';
            document.getElementById('translateYSlider').value = transform.translateY;
            document.getElementById('translateYValue').textContent = transform.translateY + 'px';
            document.getElementById('widthSlider').value = transform.width;
            document.getElementById('widthValue').textContent = transform.width + '%';
            document.getElementById('heightSlider').value = transform.height;
            document.getElementById('heightValue').textContent = transform.height + '%';
            document.getElementById('zIndexSlider').value = transform.zIndex;
            document.getElementById('zIndexValue').textContent = transform.zIndex;
            panel.style.display = 'block';
        }

        // ==================== KONTROL WARNA ====================
        function setupColorControls() {
            document.getElementById('hargaColor').addEventListener('input', function(e) {
                selectedColor = e.target.value;
                applyColorToAllHarga();
            });
        }

        function applyColorToAllHarga() {
            const textColor = getTextColorBasedOnBackground(selectedColor);
            document.querySelectorAll('.harga-wrapper').forEach(el => {
                el.style.backgroundColor = selectedColor;
                el.style.color = textColor;
            });
        }

        function setupAspectRatioListener() {
            document.getElementById('aspectRatioSelect').addEventListener('change', function(e) {
                const captureDiv = document.querySelector('#capture .capture');
                if (captureDiv) {
                    captureDiv.style.aspectRatio = e.target.value;
                }
            });
        }

        // ==================== MODE NOMOR ====================
        function setupModeListener() {
            document.getElementById('modeSelect').addEventListener('change', function(e) {
                const mode = e.target.value;
                setNoLinkMode(mode);
            });
        }

        function setNoLinkMode(mode) {
            noLinkMode = mode;
            applyNoLinkModeToCapture();
            applyNoLinkModeToForm();
        }

        function applyNoLinkModeToCapture() {
            const capture = document.getElementById('capture');
            if (!capture) return;
            if (noLinkMode === 'single') {
                const singleInput = document.getElementById('single-no-link-input');
                if (singleInput) {
                    const value = singleInput.value || '1';
                    document.querySelectorAll('.no-val, .no-val-atas, .no-val-bawah').forEach(span => {
                        span.textContent = value;
                    });
                }
            }
        }

        function applyNoLinkModeToForm() {
            const formInputs = document.getElementById('formInputs');
            if (!formInputs) return;
            formInputs.querySelectorAll('.no-row, .no-row-atas, .no-row-bawah').forEach(el => {
                if (noLinkMode === 'single') {
                    el.classList.add('hidden');
                } else {
                    el.classList.remove('hidden');
                }
            });
            const singleForm = formInputs.querySelector('.form-1-no-link');
            if (singleForm) {
                if (noLinkMode === 'single') {
                    singleForm.style.display = 'flex';
                } else {
                    singleForm.style.display = 'none';
                }
            }
        }

        // ==================== RENDER UTAMA ====================

                            </span>

                            </span>
                        </div>
                    `;
                }

                html += `</div>`;
            }

            html += `</div></div>`;
            html += `<button class="download-btn position-static" id="download-btn">Unduh Gambar (PNG)</button>`;
            wadah.innerHTML = html;

            refreshWatermarks();
            applyNoLinkModeToCapture();
            applyPaddingToCapture();
            applyGapToCapture();

            document.querySelectorAll('.img-wrap').forEach(wrap => {
                const img = wrap.querySelector('img');
                const index = parseInt(img.dataset.index);
                img.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const scaleX = this.naturalWidth / rect.width;
                    const scaleY = this.naturalHeight / rect.height;
                    const naturalX = Math.floor(x * scaleX);
                    const naturalY = Math.floor(y * scaleY);
                    if (this.complete) {
                        getColorFromImage(this, naturalX, naturalY, function(color) {
                            selectedColor = color;
                            applyColorToAllHarga();

                    translateXSpan.textContent = val + '%';
                    refreshWatermarks();
                });
            }
            const saveWatermarkBtn = document.getElementById('saveWatermarkBtn');
            if (saveWatermarkBtn) {
                saveWatermarkBtn.addEventListener('click', function() {
                    const newText = document.getElementById('watermarkInput').value;
                    const newColor = document.getElementById('watermarkColor').value;
                    const newFontSize = parseInt(document.getElementById('watermarkFontSize').value);
                    const newTranslateX = parseInt(document.getElementById('watermarkTranslateX').value);
                    localStorage.setItem('watermarkText', newText);
                    localStorage.setItem('watermarkColor', newColor);
                    localStorage.setItem('watermarkFontSize', newFontSize);
                    localStorage.setItem('watermarkTranslateX', newTranslateX);
                    watermarkText = newText;
                    watermarkColor = newColor;
                    watermarkFontSize = newFontSize;
                    watermarkTranslateX = newTranslateX;
                    Swal.fire('Tersimpan!', 'Semua pengaturan watermark telah disimpan.', 'success');
                });
            }

            // ========== SUFFIX ==========
            const suffixInput = document.getElementById('linkSuffixInput');
            const saveSuffixBtn = document.getElementById('saveSuffixBtn');
            if (saveSuffixBtn && suffixInput) {
                saveSuffixBtn.addEventListener('click', function() {
                    let newSuffix = suffixInput.value.trim();
                    if (newSuffix === '') newSuffix = 'Z';
                    localStorage.setItem('linkSuffix', newSuffix);
                    linkSuffix = newSuffix;
                    refreshLinkSuffix();
                    Swal.fire('Berhasil!', `Imbuhan "${newSuffix}" telah disimpan.`, 'success');
                });
            }

            // ========== SINGLE NO LINK ==========
            const singleFormInput = document.getElementById('single-no-link-input');
            if (singleFormInput) {
                singleFormInput.addEventListener('input', function(e) {
                    const v = e.target.value || '1';
                    if (noLinkMode === 'single') {
                        document.querySelectorAll('.no-val, .no-val-atas, .no-val-bawah').forEach(span => {
                            span.textContent = v;
                        });
                    }
                });
            }

            // ========== PADDING CONTROLS ==========
            const paddingYRange = document.getElementById('paddingYRange');
            const paddingXRange = document.getElementById('paddingXRange');
            const paddingBothRange = document.getElementById('paddingBothRange');
            const paddingYValue = document.getElementById('paddingYValue');
            const paddingXValue = document.getElementById('paddingXValue');
            const paddingBothValue = document.getElementById('paddingBothValue');
            const syncPaddingCheckbox = document.getElementById('syncPaddingCheckbox');

            function updatePaddingFromSliders() {
                applyPaddingToCapture();
            }

            if (paddingYRange) {
                paddingYRange.addEventListener('input', updatePaddingFromSliders);
            }
            if (paddingXRange) {
                paddingXRange.addEventListener('input', updatePaddingFromSliders);
            }
            if (paddingBothRange) {
                paddingBothRange.addEventListener('input', updatePaddingFromSliders);
            }

            if (syncPaddingCheckbox) {
                syncPaddingCheckbox.addEventListener('change', function() {
                    syncPadding = this.checked;
                    const paddingYControl = document.getElementById('paddingYControl');
                    const paddingXControl = document.getElementById('paddingXControl');
                    const paddingBothControl = document.getElementById('paddingBothControl');

                    if (syncPadding) {
                        paddingYControl.style.display = 'none';
                        paddingXControl.style.display = 'none';
                        paddingBothControl.style.display = 'block';
                        if (paddingYRange) paddingYRange.value = 0;
                        if (paddingXRange) paddingXRange.value = 0;
                        if (paddingYValue) paddingYValue.textContent = '0px';
                        if (paddingXValue) paddingXValue.textContent = '0px';
                        const currentBoth = parseInt(paddingBothRange ? paddingBothRange.value : 0);
                        if (paddingBothValue) paddingBothValue.textContent = currentBoth + 'px';
                    } else {
                        paddingYControl.style.display = 'block';
                        paddingXControl.style.display = 'block';
                        paddingBothControl.style.display = 'none';
                        if (paddingBothRange) paddingBothRange.value = 0;
                        if (paddingBothValue) paddingBothValue.textContent = '0px';
                        const currentY = parseInt(paddingYRange ? paddingYRange.value : 5);
                        const currentX = parseInt(paddingXRange ? paddingXRange.value : 0);
                        if (paddingYValue) paddingYValue.textContent = currentY + 'px';
                        if (paddingXValue) paddingXValue.textContent = currentX + 'px';
                    }
                    applyPaddingToCapture();
                });
                syncPaddingCheckbox.dispatchEvent(new Event('change'));
            }

            // ========== GAP CONTROLS ==========
            const gapYRange = document.getElementById('gapYRange');
            const gapXRange = document.getElementById('gapXRange');
            const gapBothRange = document.getElementById('gapBothRange');
            const gapYValue = document.getElementById('gapYValue');
            const gapXValue = document.getElementById('gapXValue');
            const gapBothValue = document.getElementById('gapBothValue');
            const syncGapCheckbox = document.getElementById('syncGapCheckbox');

            function updateGapFromSliders() {
                applyGapToCapture();
            }

            if (gapYRange) {
                gapYRange.addEventListener('input', updateGapFromSliders);
            }
            if (gapXRange) {
                gapXRange.addEventListener('input', updateGapFromSliders);
            }
            if (gapBothRange) {
                gapBothRange.addEventListener('input', updateGapFromSliders);
            }

            if (syncGapCheckbox) {
                syncGapCheckbox.addEventListener('change', function() {
                    syncGap = this.checked;
                    const gapYControl = document.getElementById('gapYControl');
                    const gapXControl = document.getElementById('gapXControl');
                    const gapBothControl = document.getElementById('gapBothControl');

                    if (syncGap) {
                        gapYControl.style.display = 'none';
                        gapXControl.style.display = 'none';
                        gapBothControl.style.display = 'block';
                        if (gapYRange) gapYRange.value = 0;
                        if (gapXRange) gapXRange.value = 0;
                        if (gapYValue) gapYValue.textContent = '0px';
                        if (gapXValue) gapXValue.textContent = '0px';
                        const currentBoth = parseInt(gapBothRange ? gapBothRange.value : 0);
                        if (gapBothValue) gapBothValue.textContent = currentBoth + 'px';
                    } else {
                        gapYControl.style.display = 'block';
                        gapXControl.style.display = 'block';
                        gapBothControl.style.display = 'none';
                        if (gapBothRange) gapBothRange.value = 0;
                        if (gapBothValue) gapBothValue.textContent = '0px';
                        const currentY = parseInt(gapYRange ? gapYRange.value : 3);
                        const currentX = parseInt(gapXRange ? gapXRange.value : 0);
                        if (gapYValue) gapYValue.textContent = currentY + 'px';
                        if (gapXValue) gapXValue.textContent = currentX + 'px';
                    }
                    applyGapToCapture();
                });
                syncGapCheckbox.dispatchEvent(new Event('change'));
            }

            // ========== DOWNLOAD ==========
            const downloadBtn = document.getElementById('download-btn');
            downloadBtn.addEventListener('click', async function() {
                const el = document.getElementById('capture');
                if (!el) return alert('Container tidak tersedia');
                const originalText = this.textContent;
                this.textContent = 'Memproses...';
                this.disabled = true;
                try {
                    if (document.fonts && document.fonts.ready) await document.fonts.ready;
                    await Promise.all(
                        Array.from(document.images).map(img => {
                            if (img.complete) return Promise.resolve();
                            return new Promise((resolve) => {
                                img.onload = resolve;
                                img.onerror = resolve;
                            });
                        })
                    );
                    const dataUrl = await htmlToImage.toPng(el, {
                        quality: 1,
                        pixelRatio: 3,
                        width: el.offsetWidth * 3,
                        height: el.offsetHeight * 3,
                        style: {
                            transform: 'scale(3)',
                            transformOrigin: 'top left'
                        },
                        backgroundColor: '#ffffff'
                    });
                    const link = document.createElement('a');
                    link.download = `capture_${count}.png`;
                    link.href = dataUrl;
                    link.click();
                } catch (error) {
                    console.error('Error generating image:', error);
                    alert('Gagal mengunduh gambar. Coba lagi.');
                } finally {
                    this.textContent = originalText;
                    this.disabled = false;
                }
            });

            // ========== RESET ==========
            const resetBtn = document.getElementById('resetBtn');
            if (resetBtn) {
                resetBtn.addEventListener('click', confirmReset);
            }

            applyNoLinkModeToForm();
        }

        // ==================== FUNGSI UPDATE NO & HARGA ====================
        function updateNo(inputElement, event) {
            const index = parseInt(inputElement.dataset.index);
            const posisi = inputElement.dataset.posisi;
            const value = inputElement.value;

            if (noLinkMode === 'many') {
                let selector = '.no-val';
                if (posisi === 'atas') selector = '.no-val-atas';
                else if (posisi === 'bawah') selector = '.no-val-bawah';

                const nodes = document.querySelectorAll(`#capture ${selector}`);
                if (nodes[index]) {
                    nodes[index].textContent = value || (index + 1);
                }
            }
        }

        function updateHarga(inputElement, event) {
            const index = parseInt(inputElement.dataset.index);
            const posisi = inputElement.dataset.posisi;
            const value = inputElement.value;

            let selector = '.harga-val';
            if (posisi === 'atas') selector = '.harga-val-atas';
            else if (posisi === 'bawah') selector = '.harga-val-bawah';

            const nodes = document.querySelectorAll(`#capture ${selector}`);
            if (nodes[index]) {
                nodes[index].textContent = value || '50';
            }
        }

        // ==================== HANDLE FILE CHANGE ====================
        function handleFileChange(index, event) {
            const label = document.querySelector(`#file-label-${index}`);
            const file = event.target.files[0];
            if (file) {
                label.classList.add("selected");
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgs = document.getElementById('capture').querySelectorAll('img');
                    if (imgs[index]) {
                        imgs[index].src = e.target.result;
                        if (imageTransforms[index]) {
                            const wrap = imgs[index].closest('.img-wrap');
                            applyTransformToImage(imgs[index], wrap, imageTransforms[index]);
                        }
                    }
                };
                reader.readAsDataURL(file);
            } else {
                label.classList.remove("selected");
            }
        }

        // ==================== RESET ====================
        function confirmReset() {
            Swal.fire({
                title: 'Yakin mau reset?',
                text: "Semua input gambar, nomor, dan harga akan dihapus!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Ya, Reset Semua!',
                cancelButtonText: 'Batal',
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    resetAllInputs();
                    Swal.fire('Berhasil!', 'Semua input telah direset.', 'success');
                }
            });
        }

        function resetAllInputs() {
            document.querySelectorAll('input[type="file"]').forEach(input => {
                input.value = '';
            });
            document.querySelectorAll('.file-label').forEach(label => {
                label.classList.remove('selected');
            });

            document.querySelectorAll('#formInputs input[type="text"]').forEach(input => {
                input.value = '';
                if (input.dataset.posisi) {
                    const placeholder = input.placeholder.toLowerCase();
                    if (placeholder.includes('no')) {
                        updateNo(input, null);
                    } else if (placeholder.includes('harga')) {
                        updateHarga(input, null);
                    }
                }
            });

            selectedColor = '#4C0094';
            document.getElementById('hargaColor').value = selectedColor;
            applyColorToAllHarga();

            const wraps = document.querySelectorAll('#capture .img-wrap');
            const count = wraps.length;
            wraps.forEach((wrap, index) => {
                const img = wrap.querySelector('img');
                if (count === 8) img.src = 'celana.jpg';
                else if (count === 2) img.src = 'img/aset_cw/2-2kolom1.png';
                else img.src = 'baju.png';
                img.style.cssText =
                    'transform: scale(1) rotate(0deg) translate(0px, 0px); width: 100%; height: auto; object-fit: fill; max-width: none; max-height: none; min-width: 0; min-height: 0;';
                wrap.style.zIndex = 1;
                wrap.style.overflow = 'visible';
            });
            if (count > 0) {
                initImageTransforms(count);
            }

            const singleInput = document.getElementById('single-no-link-input');
            if (singleInput) {
                singleInput.value = '';
                if (noLinkMode === 'single') {
                    document.querySelectorAll('.no-val, .no-val-atas, .no-val-bawah').forEach(span => {
                        span.textContent = '1';
                    });
                }
            }

            watermarkText = localStorage.getItem('watermarkText') || '';
            watermarkColor = localStorage.getItem('watermarkColor') || '#ffffff';
            watermarkFontSize = parseInt(localStorage.getItem('watermarkFontSize') || '4');
            watermarkTranslateX = parseInt(localStorage.getItem('watermarkTranslateX') || '75');

            const watermarkInput = document.getElementById('watermarkInput');
            if (watermarkInput) watermarkInput.value = watermarkText;
            const watermarkColorInput = document.getElementById('watermarkColor');
            if (watermarkColorInput) watermarkColorInput.value = watermarkColor;
            const fontSizeRange = document.getElementById('watermarkFontSize');
            if (fontSizeRange) {
                fontSizeRange.value = watermarkFontSize;
                document.getElementById('watermarkFontSizeValue').textContent = watermarkFontSize + 'px';
            }
            const translateXRange = document.getElementById('watermarkTranslateX');
            if (translateXRange) {
                translateXRange.value = watermarkTranslateX;
                document.getElementById('watermarkTranslateXValue').textContent = watermarkTranslateX + '%';
            }
            refreshWatermarks();

            const suffixInput = document.getElementById('linkSuffixInput');
            if (suffixInput) {
                suffixInput.value = linkSuffix;
            }
            refreshLinkSuffix();

            // Reset padding ke default (Y=5px, X=0px)
            paddingY = 5;
            paddingX = 0;
            paddingBoth = 0;
            syncPadding = false;
            const syncPaddingCheckbox = document.getElementById('syncPaddingCheckbox');
            if (syncPaddingCheckbox) {
                syncPaddingCheckbox.checked = false;
                syncPaddingCheckbox.dispatchEvent(new Event('change'));
            }
            const paddingYRange = document.getElementById('paddingYRange');
            const paddingXRange = document.getElementById('paddingXRange');
            const paddingBothRange = document.getElementById('paddingBothRange');
            if (paddingYRange) paddingYRange.value = 5;
            if (paddingXRange) paddingXRange.value = 0;
            if (paddingBothRange) paddingBothRange.value = 0;
            const paddingYValue = document.getElementById('paddingYValue');
            const paddingXValue = document.getElementById('paddingXValue');
            const paddingBothValue = document.getElementById('paddingBothValue');
            if (paddingYValue) paddingYValue.textContent = '5px';
            if (paddingXValue) paddingXValue.textContent = '0px';
            if (paddingBothValue) paddingBothValue.textContent = '0px';

            // Reset gap ke default (Y=3px, X=0px)
            gapY = 3;
            gapX = 0;
            gapBoth = 0;
            syncGap = false;
            const syncGapCheckbox = document.getElementById('syncGapCheckbox');
            if (syncGapCheckbox) {
                syncGapCheckbox.checked = false;
                syncGapCheckbox.dispatchEvent(new Event('change'));
            }
            const gapYRange = document.getElementById('gapYRange');
            const gapXRange = document.getElementById('gapXRange');
            const gapBothRange = document.getElementById('gapBothRange');
            if (gapYRange) gapYRange.value = 3;
            if (gapXRange) gapXRange.value = 0;
            if (gapBothRange) gapBothRange.value = 0;
            const gapYValue = document.getElementById('gapYValue');
            const gapXValue = document.getElementById('gapXValue');
            const gapBothValue = document.getElementById('gapBothValue');
            if (gapYValue) gapYValue.textContent = '3px';
            if (gapXValue) gapXValue.textContent = '0px';
            if (gapBothValue) gapBothValue.textContent = '0px';

            applyPaddingToCapture();
            applyGapToCapture();
        }

        // ==================== LAYOUT SELECT CHANGE ====================
        function updateLayout(value) {
            const satuBaris = (value === 'muncul3' || value === 'muncul2');
            const kontrolSelect = document.getElementById('kontrolModeSelect');

            if (satuBaris) {
                kontrolSelect.style.display = 'inline-block';
                if (!kontrolSelect.value) kontrolSelect.value = '2';
            } else {
                kontrolSelect.style.display = 'none';
                kontrolSelect.value = '1';
            }
            const kontrolMode = parseInt(kontrolSelect.value);

            let count, cols;
            switch (value) {
                case 'muncul9': count = 9; cols = 3; break;
                case 'muncul8': count = 8; cols = 4; break;
                case 'muncul8-2kolom': count = 8; cols = 2; break;
                case 'muncul6-2kolom': count = 6; cols = 2; break;
                case 'muncul6-3kolom': count = 6; cols = 3; break;
                case 'muncul4': count = 4; cols = 2; break;
                case 'muncul3': count = 3; cols = 3; break;
                case 'muncul2': count = 2; cols = 2; break;
                default: count = 8; cols = 4;
            }
            renderLayout(count, cols, kontrolMode, satuBaris);
            updateActiveButton(value);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateActiveButton(activeId) {
            document.querySelectorAll('.layout-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            const el = document.getElementById(activeId);
            if (el) el.classList.add('active');
        }

        // ==================== INIT ====================
        window.addEventListener('DOMContentLoaded', () => {
            const layoutSelect = document.getElementById('layoutSelect');
            layoutSelect.value = 'muncul8';
            updateLayout('muncul8');

            layoutSelect.addEventListener('change', function() {
                updateLayout(this.value);
            });

            document.getElementById('kontrolModeSelect').addEventListener('change', function() {
                const currentLayout = document.getElementById('layoutSelect').value;
                updateLayout(currentLayout);
            });

            setupColorControls();
            setupAspectRatioListener();
            setupModeListener();
            setupEditPanelListeners();

            document.getElementById('modeSelect').value = 'single';
            applyNoLinkModeToForm();
        });
    </script>
