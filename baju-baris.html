    <script>
        // Fungsi untuk format angka menjadi format harga Indonesia
        function formatHarga(angka) {
            if (!angka) return '0';
            return angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        // Fungsi untuk mengupdate preview
        function updatePreview() {
            // Update judul banner
            const judulInput = document.getElementById('judul-input');
            const judulSpan = document.getElementById('judul-span');
            if (judulInput && judulSpan) {
                judulSpan.textContent = judulInput.value;
            }

            // Update nomor utama
            const nomorUtamaInput = document.getElementById('nomor-utama-input');
            const nomorUtamaSpan = document.getElementById('nomor-utama-span');
            if (nomorUtamaInput && nomorUtamaSpan) {
                nomorUtamaSpan.textContent = nomorUtamaInput.value;

                // Update semua nomor produk sesuai dengan nomor utama
                for (let i = 1; i <= 6; i++) {
                    const nomorProdukSpan = document.getElementById(`nomor-produk-${i}-span`);
                    if (nomorProdukSpan) {
                        nomorProdukSpan.textContent = nomorUtamaInput.value;
                    }
                }
            }

            // Update harga produk
            for (let i = 1; i <= 6; i++) {
                const hargaInput = document.getElementById(`harga-produk-${i}-input`);
                const hargaSpan = document.getElementById(`harga-produk-${i}-span`);
                if (hargaInput && hargaSpan) {
                    hargaSpan.textContent = formatHarga(hargaInput.value);
                }
            }
        }

        // Fungsi untuk menangani upload gambar
        function setupImageUpload() {
            for (let i = 1; i <= 6; i++) {
                const fileInput = document.getElementById(`input-gambar-${i}`);
                const imageElement = document.getElementById(`gambar-produk-${i}`);

                if (fileInput && imageElement) {
                    fileInput.addEventListener('change', function (e) {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();

                            reader.onload = function (event) {
                                imageElement.src = event.target.result;
                            };

                            reader.readAsDataURL(file);
                        }
                    });
                }
            }
        }

        // Fungsi untuk mengatur nilai default
        function setDefaultValues() {
            // Set default value untuk judul
            const judulInput = document.getElementById('judul-input');
            const judulSpan = document.getElementById('judul-span');

            if (judulInput && judulSpan) {
                // Ambil teks default dari judul-span
                judulInput.value = judulSpan.textContent.trim();
            }

            // Set default value untuk nomor utama (ambil dari span)
            const nomorUtamaInput = document.getElementById('nomor-utama-input');
            const nomorUtamaSpan = document.getElementById('nomor-utama-span');

            if (nomorUtamaInput && nomorUtamaSpan) {
                nomorUtamaInput.value = nomorUtamaSpan.textContent.trim();
            }

            // Set default value untuk harga produk (ambil dari span)
            for (let i = 1; i <= 6; i++) {
                const hargaInput = document.getElementById(`harga-produk-${i}-input`);
                const hargaSpan = document.getElementById(`harga-produk-${i}-span`);

                if (hargaInput && hargaSpan) {
                    // Hapus "Rp." dan format titik dari harga di span
                    let hargaText = hargaSpan.textContent.trim();
                    // Hapus titik pemisah ribuan jika ada
                    hargaText = hargaText.replace(/\./g, '');
                    hargaI nput.value = hargaText;
                }
            }
        }

        // Event listener untuk real-time update
        function setupEventListeners() {
            // Update judul
            const judulInput = document.getElementById('judul-input');
            if (judulInput) {
                judulInput.addEventListener('input', updatePreview);
            }

            // Update nomor utama
            const nomorUtamaInput = document.getElementById('nomor-utama-input');
            if (nomorUtamaInput) {
                nomorUtamaInput.addEventListener('input', updatePreview);
            }

            // Update semua harga produk
            for (let i = 1; i <= 6; i++) {
                const hargaInput = document.getElementById(`harga-produk-${i}-input`);
                if (hargaInput) {
                    hargaInput.addEventListener('input', updatePreview);
                }
            }
        }

        // Inisialisasi semua fitur ketika halaman dimuat
        document.addEventListener('DOMContentLoaded', function () {
            // Set nilai default terlebih dahulu
            setDefaultValues();

            // Setup event listeners dan lainnya
            setupEventListeners();
            setupImageUpload();
            updatePreview();

            // Tambahkan validasi input untuk harga (hanya angka)
            const hargaInputs = document.querySelectorAll('input[id^="harga-produk-"]');
            hargaInputs.forEach(input => {
                input.addEventListener('input', function () {
                    // Hanya izinkan angka
                    this.value = this.value.replace(/[^0-9]/g, '');
                });
            });

            // Validasi input untuk nomor utama (hanya angka)
            const nomorUtamaInput = document.getElementById('nomor-utama-input');
            if (nomorUtamaInput) {
                nomorUtamaInput.addEventListener('input', function () {
                    this.value = this.value.replace(/[^0-9]/g, '');
                });
            }
        });
    </script>
